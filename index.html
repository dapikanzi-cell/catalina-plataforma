<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalina — Profe IA</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0a1a;--card:#13132b;--border:rgba(255,255,255,0.08);
  --text:#f0edff;--text2:#9990c8;--text3:#4a4570;
  --purple:#7c6fcd;--purple2:#a08fef;
  --green:#4ecb8d;--yellow:#ffd166;--red:#ff6b6b;--pink:#ff9eb5;
  --r:16px;--rs:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;overflow-x:hidden}

/* ── PANTALLA SELECCIÓN ── */
#s-select{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.select-title{font-family:'Fredoka One',sans-serif;font-size:32px;color:var(--purple2);margin-bottom:4px;text-align:center}
.select-sub{font-size:14px;color:var(--text3);margin-bottom:32px;text-align:center}
.materias-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:440px;margin-bottom:24px}
.materia-btn{background:var(--card);border:2px solid var(--border);border-radius:var(--r);padding:20px 16px;cursor:pointer;transition:all 0.2s;text-align:center}
.materia-btn:hover{border-color:var(--purple);transform:translateY(-3px);box-shadow:0 8px 24px rgba(124,111,205,0.3)}
.materia-btn .icon{font-size:36px;margin-bottom:8px}
.materia-btn .name{font-size:15px;font-weight:700;color:var(--text)}
.materia-btn .desc{font-size:11px;color:var(--text3);margin-top:4px}
.apikey-wrap{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:16px;margin-bottom:12px}
.apikey-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px}
.apikey-row{display:flex;gap:8px}
.apikey-input{flex:1;background:rgba(255,255,255,0.05);border:1.5px solid var(--border);border-radius:var(--rs);padding:10px 14px;color:var(--text);font-size:13px;font-family:'Nunito',sans-serif;outline:none;transition:border-color 0.15s}
.apikey-input:focus{border-color:var(--purple)}
.apikey-status{font-size:11px;margin-top:6px;color:var(--text3)}
.eye-btn{background:rgba(255,255,255,0.05);border:1.5px solid var(--border);border-radius:var(--rs);padding:10px 12px;cursor:pointer;color:var(--text2);font-size:14px}

/* ── PANTALLA CLASE ── */
#s-clase{display:none;flex-direction:column;min-height:100vh}

/* HEADER */
.clase-header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.profe-bubble{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#1a3a2a,#0d2018);border:2px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;position:relative}
.profe-bubble.speaking::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--green);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(1.12)}}
.header-info{flex:1}
.header-name{font-family:'Fredoka One',sans-serif;font-size:16px;color:var(--green)}
.header-status{font-size:11px;color:var(--text3)}
.header-right{display:flex;align-items:center;gap:8px}
.timer-badge{font-size:12px;font-weight:700;color:var(--yellow);background:rgba(255,209,102,0.1);border:1px solid rgba(255,209,102,0.2);padding:4px 10px;border-radius:20px;font-family:monospace}
.close-btn{background:rgba(255,107,107,0.1);border:1px solid rgba(255,107,107,0.2);color:var(--red);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:700}

/* PROGRESO */
.progress-bar{height:3px;background:var(--border);position:relative}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--green));transition:width 0.5s ease;border-radius:0 2px 2px 0}

/* ÁREA PRINCIPAL */
.clase-body{flex:1;display:flex;flex-direction:column;padding:16px;gap:12px;max-width:600px;width:100%;margin:0 auto;padding-bottom:160px}

/* BURBUJA IMAGEN */
.visual-card{background:linear-gradient(135deg,#0d1a2a,#050d18);border:1px solid rgba(78,203,141,0.2);border-radius:var(--r);overflow:hidden;animation:fadeUp 0.4s ease}
.visual-img{width:100%;max-height:240px;object-fit:cover;display:block}
.visual-caption{padding:10px 14px;font-size:12px;color:var(--text2);line-height:1.5;font-style:italic}

/* BURBUJAS CHAT */
.msg{padding:14px 16px;border-radius:var(--rs);font-size:15px;line-height:1.7;animation:fadeUp 0.3s ease;max-width:94%}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.msg-profe{background:var(--card);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.msg-profe.highlight{border-color:var(--purple);background:rgba(124,111,205,0.08)}
.msg-cata{background:rgba(124,111,205,0.15);border:1px solid rgba(124,111,205,0.25);align-self:flex-end;border-bottom-right-radius:4px}
.msg-typing{background:var(--card);border:1px solid var(--border);align-self:flex-start;padding:14px 18px;border-bottom-left-radius:4px}
.dots{display:flex;gap:5px;align-items:center}
.dot{width:8px;height:8px;background:var(--text3);border-radius:50%;animation:bounce 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:0.2s}
.dot:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}

/* OPCIONES DE RESPUESTA */
.opciones-wrap{display:flex;flex-direction:column;gap:8px;animation:fadeUp 0.3s ease}
.opcion-btn{background:var(--card);border:2px solid var(--border);border-radius:var(--rs);padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600;color:var(--text2);transition:all 0.18s;text-align:left;font-family:'Nunito',sans-serif}
.opcion-btn:hover{border-color:var(--purple);color:var(--text);transform:translateX(4px)}
.opcion-btn.correcta{border-color:var(--green);background:rgba(78,203,141,0.1);color:var(--green)}
.opcion-btn.incorrecta{border-color:var(--red);background:rgba(255,107,107,0.08);color:var(--red)}

/* INPUT LIBRE */
.input-wrap{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,26,0.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:12px 16px;z-index:200}
.input-inner{max-width:600px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.chat-input{flex:1;background:var(--card);border:1.5px solid var(--border);border-radius:var(--rs);padding:12px 16px;color:var(--text);font-size:14px;font-family:'Nunito',sans-serif;outline:none;resize:none;max-height:100px;transition:border-color 0.15s;line-height:1.5}
.chat-input:focus{border-color:var(--purple)}
.send-btn{background:linear-gradient(135deg,var(--purple),var(--purple2));border:none;border-radius:var(--rs);padding:12px 18px;cursor:pointer;font-size:18px;flex-shrink:0;transition:all 0.2s}
.send-btn:hover{transform:scale(1.08)}
.send-btn:disabled{opacity:0.3;cursor:not-allowed;transform:none}

/* PAUSA FIJA */
#btn-pausa{position:fixed;bottom:76px;right:16px;z-index:300;background:rgba(255,107,107,0.15);border:1.5px solid var(--red);color:var(--red);border-radius:99px;padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;backdrop-filter:blur(8px)}

/* MODAL 20 MIN */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:28px;max-width:380px;width:100%;text-align:center}
.modal-emoji{font-size:52px;margin-bottom:12px}
.modal-title{font-family:'Fredoka One',sans-serif;font-size:22px;color:var(--text);margin-bottom:8px}
.modal-sub{font-size:14px;color:var(--text2);margin-bottom:24px;line-height:1.6}
.modal-btn{display:block;width:100%;padding:14px;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;margin-bottom:10px;transition:all 0.2s}
.modal-btn.verde{background:linear-gradient(135deg,#1D9E75,var(--green));color:white}
.modal-btn.purple{background:linear-gradient(135deg,var(--purple),var(--purple2));color:white}
.modal-btn.gris{background:rgba(255,255,255,0.06);color:var(--text2);border:1px solid var(--border)}
.modal-btn:hover{transform:translateY(-2px)}

/* NOTIF */
.notif{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--green);border-radius:var(--rs);padding:11px 20px;font-size:13px;color:var(--green);z-index:9999;white-space:nowrap;animation:fadeUp 0.3s ease}

/* VOZ */
.voz-btn{background:rgba(78,203,141,0.1);border:1px solid rgba(78,203,141,0.2);color:var(--green);border-radius:99px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;margin-top:8px;display:inline-flex;align-items:center;gap:6px}
.voz-btn.activa{background:rgba(78,203,141,0.25);animation:pulse 1.5s ease-in-out infinite}

/* BADGE MATERIA */
.materia-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(124,111,205,0.1);border:1px solid rgba(124,111,205,0.2);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--purple2);font-weight:700}
</style>
</head>
<body>

<!-- ══ PANTALLA SELECCIÓN ══ -->
<div id="s-select">
  <div style="font-size:52px;margin-bottom:8px">🦕</div>
  <div class="select-title">¡Hola, Catalina!</div>
  <div class="select-sub">¿Qué quieres aprender hoy?</div>

  <div class="materias-grid">
    <div class="materia-btn" onclick="elegirMateria('math')">
      <div class="icon">📐</div>
      <div class="name">Matemáticas</div>
      <div class="desc">Funciones y geometría</div>
    </div>
    <div class="materia-btn" onclick="elegirMateria('lengua')">
      <div class="icon">📖</div>
      <div class="name">Lengua</div>
      <div class="desc">Literatura y escritura</div>
    </div>
    <div class="materia-btn" onclick="elegirMateria('historia')">
      <div class="icon">🗺️</div>
      <div class="name">Historia</div>
      <div class="desc">Humanismo y revoluciones</div>
    </div>
    <div class="materia-btn" onclick="elegirMateria('ciencias')">
      <div class="icon">🔬</div>
      <div class="name">Ciencias</div>
      <div class="desc">Biología y química</div>
    </div>
  </div>

  <div class="apikey-wrap">
    <div class="apikey-label">🔑 API Key de Anthropic</div>
    <div class="apikey-row">
      <input type="password" class="apikey-input" id="apikey" placeholder="sk-ant-api03-..." oninput="onApiKey(this.value)">
      <button class="eye-btn" onclick="toggleEye()">👁</button>
    </div>
    <div class="apikey-status" id="apikey-status"></div>
  </div>
</div>

<!-- ══ PANTALLA CLASE ══ -->
<div id="s-clase">
  <div class="clase-header">
    <div class="profe-bubble" id="profe-bubble">🦖</div>
    <div class="header-info">
      <div class="header-name">Profe IA</div>
      <div class="header-status" id="header-status">Preparando la clase...</div>
    </div>
    <div class="header-right">
      <div class="timer-badge" id="timer">00:00</div>
      <button class="close-btn" onclick="volverSelect()">✕</button>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>

  <div class="clase-body" id="clase-body"></div>

  <button id="btn-pausa" onclick="mostrarPausa()">⏸ Pausa</button>

  <div class="input-wrap">
    <div class="input-inner">
      <textarea class="chat-input" id="cinput" placeholder="Escribe tu respuesta..." rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviarRespuesta()}"
        oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="enviarRespuesta()">→</button>
    </div>
  </div>
</div>

<!-- ══ MODAL ══ -->
<div class="modal-overlay" id="modal" style="display:none">
  <div class="modal-box" id="modal-box"></div>
</div>

<script>
// ═══ CONFIG ═══
const EMAIL_SVC = 'service_6tb2das';
const EMAIL_TPL = 'template_y4c0aas';
const EMAIL_KEY = 'HWOFrv8sGOcNtW9Ti';
const TUTOR    = 'dapikanzi@hotmail.com';
const TUTOR2   = 'margarita2883@gmail.com';

let API_KEY = localStorage.getItem('cat_api_key') || '';
try { emailjs.init(EMAIL_KEY); } catch(e){}

// ═══ ESTADO ═══
let materia = null;
let historial = [];
let sesionSecs = 0;
let timerInterval = null;
let hablando = false;
let vozActiva = true;
let alertados20 = false;
let progreso = 0;

const MATERIAS = {
  math:     { icon:'📐', nombre:'Matemáticas', color:'#7c6fcd' },
  lengua:   { icon:'📖', nombre:'Lengua y Literatura', color:'#ff9eb5' },
  historia: { icon:'🗺️', nombre:'Historia', color:'#ffd166' },
  ciencias: { icon:'🔬', nombre:'Ciencias Naturales', color:'#4ecb8d' }
};

// ═══ SISTEMA DEL PROFE IA ═══
function buildSistema(mat) {
  const base = `Eres el Profe IA de Catalina, 14 años, TDAH+TEA, 8° básico Chile.
Catalina ama los DINOSAURIOS, paleontología, geología, My Little Pony, dibujar y los gatos.

TU MODO DE ENSEÑAR — SIEMPRE en este orden:
1. GANCHO: empieza con un dato sorprendente de dinosaurios/geología relacionado al tema. Una frase. Que quiera saber más.
2. EXPLICA: máximo 2-3 oraciones. Una sola idea. Con un ejemplo de dinosaurios o fósiles.
3. IMAGEN: cuando sea útil, escribe exactamente [IMG:descripción_de_imagen_en_inglés] para mostrar una imagen de apoyo.
4. PREGUNTA: una sola pregunta directa. Puede ser de opción múltiple con [OPC:A|B|C|D] o abierta.
5. REACCIONA: cuando responde, reacciona a LO QUE DIJO. Si está bien → celebra con energía. Si falla → humor + pista + nuevo ejemplo de dinos. Si no entiende → analogía diferente más simple.
6. AVANZA: solo cuando confirmaste que entendió.

REGLAS ESTRICTAS:
- NUNCA más de 3 oraciones seguidas sin una pregunta.
- SIEMPRE termina con una pregunta o acción concreta para Catalina.
- Habla directo a ella: "Catalina", "tú", "¿qué crees?"
- Tono: cercano, divertido, como un amigo que sabe mucho.
- Español natural de Chile.
- Cuando Catalina haya completado el bloque: escribe [FIN_BLOQUE] al final.
- Para imágenes escribe [IMG:english description] — ej: [IMG:fossil bones excavation site]
- Para opciones escribe [OPC:opción1|opción2|opción3]`;

  const contenidos = {
    math: `TEMA: Matemáticas 8° básico. Contenidos: función lineal f(x)=mx (pasa por origen), función afín f(x)=mx+n, pendiente m=(y2-y1)/(x2-x1), gráficas en plano cartesiano, funciones crecientes/decrecientes, rectas paralelas y perpendiculares. Geometría: polígonos, áreas, perímetros, semejanza, Teorema de Thales, isometrías (traslación, rotación, simetría), volumen. Conecta con fósiles: "la profundidad de un fósil es función lineal del tiempo", "la pendiente de un estrato geológico", "el perímetro del cráneo de un dinosaurio".`,
    lengua: `TEMA: Lengua y Literatura 8° básico. Contenidos: texto argumentativo (tesis, argumentos, conclusión), análisis literario (narrador, personajes, conflicto, clímax), figuras retóricas (metáfora, símil, hipérbole, personificación), comprensión lectora, inferencias, género lírico (verso, estrofa, rima). Conecta con fósiles y dinosaurios: usa textos sobre paleontología como ejemplos.`,
    historia: `TEMA: Historia 8° básico. Contenidos: Humanismo y Renacimiento (Erasmo, Leonardo, Gutenberg 1440), Reforma Lutera (1517, indulgencias), conquista de América (Colón 1492, encomienda, mita), Ilustración (Rousseau, Montesquieu, Locke), Revolución Francesa (1789, guillotina, libertad-igualdad-fraternidad), Revolución Americana (1776). Conecta con geología: "la imprenta = revolución tan grande como encontrar el primer fósil".`,
    ciencias: `TEMA: Ciencias Naturales 8° básico. Contenidos: célula (membrana, núcleo, citoplasma, organelos; procariota/eucariota; animal/vegetal con cloroplasto), mitosis (interfase, profase, metafase, anafase, telofase), ADN y genética (gen, alelo, dominante/recesivo, Mendel), evolución Darwin (selección natural, fósiles como evidencia), tabla periódica (grupos, períodos, número atómico, metales/no metales), reacciones químicas, leyes de Newton, energía cinética/potencial. Conecta TODO con dinosaurios y fósiles.`
  };

  return base + '\n\n' + contenidos[mat];
}

// ═══ API KEY ═══
function onApiKey(val) {
  val = val.trim();
  const st = document.getElementById('apikey-status');
  if (val.startsWith('sk-ant') && val.length > 20) {
    API_KEY = val;
    localStorage.setItem('cat_api_key', val);
    st.style.color = '#4ecb8d';
    st.textContent = '✅ Key guardada';
  } else if (val.length > 5) {
    st.style.color = '#ffd166';
    st.textContent = '⚠️ Debe empezar con sk-ant-api03-...';
  } else {
    st.textContent = '';
  }
}

function toggleEye() {
  const inp = document.getElementById('apikey');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

// Restaurar key al cargar
(function() {
  if (API_KEY) {
    const inp = document.getElementById('apikey');
    if (inp) inp.value = API_KEY;
    const st = document.getElementById('apikey-status');
    if (st) { st.textContent = '✅ Key guardada'; st.style.color = '#4ecb8d'; }
  }
})();

// ═══ NAVEGACIÓN ═══
function elegirMateria(mat) {
  if (!API_KEY) {
    notif('⚠️ Primero ingresa tu API Key');
    document.getElementById('apikey').focus();
    return;
  }
  materia = mat;
  historial = [];
  sesionSecs = 0;
  alertados20 = false;
  progreso = 0;
  document.getElementById('s-select').style.display = 'none';
  document.getElementById('s-clase').style.display = 'flex';
  document.getElementById('s-clase').style.flexDirection = 'column';
  document.getElementById('clase-body').innerHTML = '';
  iniciarTimer();
  iniciarClase();
}

function volverSelect() {
  detenerTimer();
  detenerVoz();
  document.getElementById('s-clase').style.display = 'none';
  document.getElementById('s-select').style.display = 'flex';
}

// ═══ TIMER ═══
function iniciarTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    sesionSecs++;
    const m = Math.floor(sesionSecs / 60);
    const s = sesionSecs % 60;
    document.getElementById('timer').textContent = m + ':' + (s < 10 ? '0' : '') + s;
    if (sesionSecs === 20 * 60 && !alertados20) {
      alertados20 = true;
      mostrar20min();
    }
  }, 1000);
}

function detenerTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

// ═══ VOZ (Web Speech API) ═══
let utterance = null;
function hablar(texto) {
  if (!vozActiva) return;
  detenerVoz();
  const limpio = texto.replace(/\[IMG:[^\]]+\]/g, '').replace(/\[OPC:[^\]]+\]/g, '').replace(/\[FIN_BLOQUE\]/g, '').replace(/[📐📖🗺️🔬🦕🦴🌋🦖]/g, '').trim();
  if (!limpio) return;
  utterance = new SpeechSynthesisUtterance(limpio);
  utterance.lang = 'es-CL';
  utterance.rate = 0.92;
  utterance.pitch = 1.05;
  utterance.onstart = () => { hablando = true; document.getElementById('profe-bubble').classList.add('speaking'); };
  utterance.onend = () => { hablando = false; document.getElementById('profe-bubble').classList.remove('speaking'); };
  utterance.onerror = () => { hablando = false; document.getElementById('profe-bubble').classList.remove('speaking'); };
  speechSynthesis.speak(utterance);
}

function detenerVoz() {
  speechSynthesis.cancel();
  hablando = false;
  const b = document.getElementById('profe-bubble');
  if (b) b.classList.remove('speaking');
}

function toggleVoz() {
  vozActiva = !vozActiva;
  if (!vozActiva) detenerVoz();
  notif(vozActiva ? '🔊 Voz activada' : '🔇 Voz silenciada');
}

// ═══ LLAMADA A CLAUDE ═══
async function llamarIA(mensajes, sistema) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': API_KEY,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-5',
      max_tokens: 600,
      system: sistema,
      messages: mensajes
    })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.content?.[0]?.text || '';
}

// ═══ BUSCAR IMAGEN ═══
async function buscarImagen(query) {
  try {
    const url = `https://source.unsplash.com/600x300/?${encodeURIComponent(query)}`;
    return url;
  } catch(e) { return null; }
}

// ═══ RENDERIZAR RESPUESTA DEL PROFE ═══
async function renderRespuestaProfe(texto) {
  const body = document.getElementById('clase-body');

  // Procesar imagen
  const imgMatch = texto.match(/\[IMG:([^\]]+)\]/);
  const textoLimpio = texto.replace(/\[IMG:[^\]]+\]/g, '').replace(/\[FIN_BLOQUE\]/g, '').trim();

  // Extraer opciones si hay
  const opcMatch = textoLimpio.match(/\[OPC:([^\]]+)\]/);
  const textoFinal = textoLimpio.replace(/\[OPC:[^\]]+\]/g, '').trim();

  // Mostrar burbuja de texto
  if (textoFinal) {
    const div = document.createElement('div');
    div.className = 'msg msg-profe';
    div.textContent = textoFinal;
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
    hablar(textoFinal);
  }

  // Mostrar imagen si hay
  if (imgMatch) {
    const query = imgMatch[1];
    const imgUrl = `https://source.unsplash.com/600x280/?${encodeURIComponent(query)}`;
    const vc = document.createElement('div');
    vc.className = 'visual-card';
    vc.innerHTML = `<img class="visual-img" src="${imgUrl}" alt="${query}" onerror="this.parentElement.style.display='none'">
      <div class="visual-caption">📸 ${query}</div>`;
    body.appendChild(vc);
    body.scrollTop = body.scrollHeight;
  }

  // Mostrar opciones si hay
  if (opcMatch) {
    const opts = opcMatch[1].split('|');
    const wrap = document.createElement('div');
    wrap.className = 'opciones-wrap';
    wrap.id = 'opciones-wrap';
    opts.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'opcion-btn';
      btn.textContent = opt.trim();
      btn.onclick = () => seleccionarOpcion(opt.trim(), wrap);
      wrap.appendChild(btn);
    });
    body.appendChild(wrap);
    body.scrollTop = body.scrollHeight;
    // Deshabilitar input mientras hay opciones
    document.getElementById('cinput').disabled = true;
    document.getElementById('send-btn').disabled = true;
  }

  // Actualizar progreso
  progreso = Math.min(progreso + 8, 95);
  document.getElementById('progress').style.width = progreso + '%';

  // Verificar fin de bloque
  if (texto.includes('[FIN_BLOQUE]')) {
    setTimeout(() => finBloque(), 1500);
  }
}

function seleccionarOpcion(opcion, wrap) {
  // Deshabilitar todos los botones
  wrap.querySelectorAll('.opcion-btn').forEach(b => b.disabled = true);
  // Enviar como respuesta de Catalina
  document.getElementById('cinput').disabled = false;
  document.getElementById('send-btn').disabled = false;
  agregarMsgCata(opcion);
  procesarRespuesta(opcion);
}

// ═══ FLUJO PRINCIPAL ═══
async function iniciarClase() {
  const m = MATERIAS[materia];
  document.getElementById('header-status').textContent = m.nombre;
  document.getElementById('profe-bubble').textContent = m.icon;

  mostrarTyping();
  try {
    const primerMsg = `[INICIO DE CLASE]
Catalina está lista para aprender ${m.nombre}.
INSTRUCCIÓN: Empieza CON UN GANCHO sorprendente de dinosaurios/geología.
Luego explica el primer concepto en máximo 2 oraciones.
Si aplica, añade [IMG:descripción en inglés] para mostrar imagen visual.
Termina con una pregunta concreta (opciones con [OPC:A|B|C] o abierta).`;

    historial.push({ role: 'user', content: primerMsg });
    const resp = await llamarIA(historial, buildSistema(materia));
    historial.push({ role: 'assistant', content: resp });
    quitarTyping();
    await renderRespuestaProfe(resp);
  } catch(e) {
    quitarTyping();
    agregarMsgProfe('⚠️ ' + e.message);
  }
}

async function procesarRespuesta(texto) {
  mostrarTyping();
  try {
    historial.push({ role: 'user', content: texto });
    const resp = await llamarIA(historial, buildSistema(materia));
    historial.push({ role: 'assistant', content: resp });
    quitarTyping();
    await renderRespuestaProfe(resp);
  } catch(e) {
    quitarTyping();
    agregarMsgProfe('⚠️ ' + e.message);
  }
}

function enviarRespuesta() {
  const inp = document.getElementById('cinput');
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = '';
  inp.style.height = 'auto';
  agregarMsgCata(txt);
  procesarRespuesta(txt);
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

  const body = document.getElementById('clase-body');
  const d = document.createElement('div');

  d.innerHTML = '<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  body.appendChild(d);

}

  body.appendChild(d);
  body.scrollTop = body.scrollHeight;
}
